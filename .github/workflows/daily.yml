name: Daily Blog Automation

on:
  # cron 비활성화: 로컬 launchd(한국 IP 실측)로 이전됨. 수동 실행만 유지.
  workflow_dispatch:

jobs:
  automate:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # history.json commit push 위해 필요

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Fetch Notion yesterday's data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/fetch_notion.py

      - name: Measure keyword ranks
        run: python scripts/measure_ranks.py

      - name: Generate reports
        run: python scripts/generate_reports.py

      - name: Commit updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/history.json data/reports/ || true
          git diff --staged --quiet || git commit -m "auto: $(date +%Y-%m-%d) 데이터 갱신"
          git push
