name: Test Measure (원샷 - 특정 업체)

on:
  workflow_dispatch:
    inputs:
      blog_id:
        description: '테스트할 블로그 ID (기본: sh33391 서휘)'
        default: 'sh33391'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser wkhtmltopdf || sudo apt-get install -y chromium
      - name: RSS ingest (${{ inputs.blog_id }})
        run: python scripts/naver_rss_ingest.py ${{ inputs.blog_id }}
      - name: Measure ranks
        run: python scripts/measure_playwright.py ${{ inputs.blog_id }}
      - name: Commit updated history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet || git commit -m "chore: test measure ${{ inputs.blog_id }}"
          git push
      - name: Generate report for the blog
        run: |
          case "${{ inputs.blog_id }}" in
            chanwoo0919) client=masil ;;
            cowper7710) client=cowper ;;
            cdo27953) client=mecca ;;
            kbtax0503) client=dawon ;;
            sh33391) client=seohwi ;;
            shingonggandesign02) client=shingonggan ;;
            cdo2795) client=gunterior ;;
            cdo27952) client=gunteriors ;;
            cdo27951) client=gunterior_house ;;
            leverager_solution) client=leso ;;
            kkomkkomcleaning) client=kkomkkom ;;
            *) echo "❌ unknown blog_id"; exit 1 ;;
          esac
          python scripts/internal_report.py "$client"
          echo "=== PDF 확인 ==="
          ls -lh reports/internal/*.pdf || echo "no pdf"
      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ inputs.blog_id }}
          path: reports/internal/*.pdf
          if-no-files-found: error
