name: Report Only (실측 없이 리포트만 재생성)

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser wkhtmltopdf || sudo apt-get install -y chromium
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -f -v
      - name: Generate PDFs
        run: python scripts/weekly_reports.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Upload PDFs to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: report-only-${{ github.run_id }}
          name: 재생성 리포트 ${{ github.run_id }}
          files: reports/*.pdf
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Post Notion summary page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_NUM: ${{ github.run_id }}
        run: python scripts/post_notion_summary.py
